<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1152" viewBox="0 0 1120 1152" role="img" aria-labelledby="t d"><title id="t">The craft</title><desc id="d">01. I automate what depended on someone remembering. Azure Functions in Python, on HTTP and timer triggers, that own the whole routine: generate, sign, send, verify. 02. I deliver the whole feature, not my slice of it. Screen, API, query, migration and deploy. When the rule is wrong in the database, a pretty interface fixes nothing. 03. I make systems talk that were never built to. Data contracts between platforms nobody designed together, with webhooks, retries and idempotency so an event never counts twice. 04. I instrument what nobody is watching. A scheduled job fails silently while the dashboard stays green. I make a business error show up as an error, not a 200. 05. I treat documents and credentials as attack surface. If a certificate can be forged by knowing the format, it is worth nothing. The secret lives on the server, never in the shape of the code. 06. I put AI agents into production on a leash. A model classifies well and decides badly. It adds judgment; dispatch stays in deterministic code, behind human approval.</desc><style>@font-face{font-family:'disp';src:url(data:font/woff2;base64,) format('woff2')}.disp{font-family:'disp'}@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'mono'}@font-face{font-family:'sans';src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:'sans'}@font-face{font-family:'title';src:url(data:font/woff2;base64,) format('woff2')}.title{font-family:'title'}text{font-kerning:normal;text-rendering:geometricPrecision}</style><defs></defs><rect x="0" y="0" width="1120" height="1152" fill="#080a0f" /><text x="40.0" y="50.0" class="mono" font-size="13" letter-spacing="1.95" fill="#ff655a">003</text><text x="1080.0" y="50.0" class="mono" font-size="13" letter-spacing="1.95" fill="#7d8088" text-anchor="end">AT XP EDUCAÇÃO · 01 — 06</text><text x="37.0" y="142.0" class="disp" font-size="84" letter-spacing="-2.35" fill="#f6f7f8">THE CRAFT</text><line x1="40" y1="177" x2="1080" y2="177" stroke="#f6f7f8" stroke-opacity="0.14" stroke-width="1" class=""/><text x="40.0" y="232.0" class="mono" font-size="14" letter-spacing="2.10" fill="#ff655a">01</text><text x="40.0" y="282.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">I automate what depended on</text><text x="40.0" y="316.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">someone remembering</text><text x="40.0" y="364.0" class="sans" font-size="18" fill="#aeb1b8">Azure Functions in Python, on HTTP and timer triggers,</text><text x="40.0" y="392.0" class="sans" font-size="18" fill="#aeb1b8">that own the whole routine: generate, sign, send, verify.</text><text x="40.0" y="442.0" class="mono" font-size="12" letter-spacing="1.80" fill="#7d8088">CASE — CERTIFICATE PIPELINE</text><text x="600.0" y="232.0" class="mono" font-size="14" letter-spacing="2.10" fill="#ff655a">02</text><text x="600.0" y="282.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">I deliver the whole feature, not my</text><text x="600.0" y="316.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">slice of it</text><text x="600.0" y="364.0" class="sans" font-size="18" fill="#aeb1b8">Screen, API, query, migration and deploy. When the rule is</text><text x="600.0" y="392.0" class="sans" font-size="18" fill="#aeb1b8">wrong in the database, a pretty interface fixes nothing.</text><text x="600.0" y="442.0" class="mono" font-size="12" letter-spacing="1.80" fill="#7d8088">CASE — STUDENT ID CARD</text><line x1="0" y1="484" x2="1120" y2="484" stroke="#f6f7f8" stroke-opacity="0.14" stroke-width="1" class=""/><text x="40.0" y="538.0" class="mono" font-size="14" letter-spacing="2.10" fill="#ff655a">03</text><text x="40.0" y="588.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">I make systems talk that were</text><text x="40.0" y="622.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">never built to</text><text x="40.0" y="670.0" class="sans" font-size="18" fill="#aeb1b8">Data contracts between platforms nobody designed</text><text x="40.0" y="698.0" class="sans" font-size="18" fill="#aeb1b8">together, with webhooks, retries and idempotency so an</text><text x="40.0" y="726.0" class="sans" font-size="18" fill="#aeb1b8">event never counts twice.</text><text x="40.0" y="776.0" class="mono" font-size="12" letter-spacing="1.80" fill="#7d8088">CASE — CONTRACTS, LMS, PAYMENTS</text><text x="600.0" y="538.0" class="mono" font-size="14" letter-spacing="2.10" fill="#ff655a">04</text><text x="600.0" y="588.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">I instrument what nobody is</text><text x="600.0" y="622.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">watching</text><text x="600.0" y="670.0" class="sans" font-size="18" fill="#aeb1b8">A scheduled job fails silently while the dashboard stays</text><text x="600.0" y="698.0" class="sans" font-size="18" fill="#aeb1b8">green. I make a business error show up as an error, not a</text><text x="600.0" y="726.0" class="sans" font-size="18" fill="#aeb1b8">200.</text><text x="600.0" y="776.0" class="mono" font-size="12" letter-spacing="1.80" fill="#7d8088">CASE — AUTOMATION OBSERVABILITY</text><line x1="0" y1="818" x2="1120" y2="818" stroke="#f6f7f8" stroke-opacity="0.14" stroke-width="1" class=""/><text x="40.0" y="872.0" class="mono" font-size="14" letter-spacing="2.10" fill="#ff655a">05</text><text x="40.0" y="922.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">I treat documents and credentials</text><text x="40.0" y="956.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">as attack surface</text><text x="40.0" y="1004.0" class="sans" font-size="18" fill="#aeb1b8">If a certificate can be forged by knowing the format, it is</text><text x="40.0" y="1032.0" class="sans" font-size="18" fill="#aeb1b8">worth nothing. The secret lives on the server, never in the</text><text x="40.0" y="1060.0" class="sans" font-size="18" fill="#aeb1b8">shape of the code.</text><text x="40.0" y="1110.0" class="mono" font-size="12" letter-spacing="1.80" fill="#7d8088">CASE — AUTHENTICITY HASH + VALIDATOR</text><text x="600.0" y="872.0" class="mono" font-size="14" letter-spacing="2.10" fill="#ff655a">06</text><text x="600.0" y="922.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">I put AI agents into production on</text><text x="600.0" y="956.0" class="title" font-size="30" letter-spacing="-0.54" fill="#f6f7f8">a leash</text><text x="600.0" y="1004.0" class="sans" font-size="18" fill="#aeb1b8">A model classifies well and decides badly. It adds</text><text x="600.0" y="1032.0" class="sans" font-size="18" fill="#aeb1b8">judgment; dispatch stays in deterministic code, behind</text><text x="600.0" y="1060.0" class="sans" font-size="18" fill="#aeb1b8">human approval.</text><text x="600.0" y="1110.0" class="mono" font-size="12" letter-spacing="1.80" fill="#7d8088">CASE — SUSTENTABOT</text><line x1="560" y1="178" x2="560" y2="1152" stroke="#f6f7f8" stroke-opacity="0.14" stroke-width="1"/><rect x="0.5" y="0.5" width="1119" height="1151" fill="none" stroke="#f6f7f8" stroke-opacity="0.14" /><path d="M12 0H0V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M1108 0H1120V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M12 1152H0V1140" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M1108 1152H1120V1140" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/></svg>