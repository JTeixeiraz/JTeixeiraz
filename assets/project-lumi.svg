<svg xmlns="http://www.w3.org/2000/svg" width="560" height="681.5999999999999" viewBox="0 0 560 681.5999999999999" role="img" aria-labelledby="t d"><title id="t">LUMI — OWN PRODUCT · CLOSED TESTING</title><desc id="d">A self-care app with an AI companion that runs a consultation by conversation and builds the routine from what it learns. The model chain lives in an Edge Function: the device knows no model name, and keys never leave the server. A fallback rule set by measurement — a 429 rotates the key, any other failure rotates the model. Structured JSON output as the injection defense: a reply that can only fill a closed schema cannot carry an instruction.</desc><style>@font-face{font-family:'disp';src:url(data:font/woff2;base64,) format('woff2')}.disp{font-family:'disp'}@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'mono'}@font-face{font-family:'sans';src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:'sans'}text{font-kerning:normal;text-rendering:geometricPrecision}</style><defs></defs><rect x="0" y="0" width="560" height="681.5999999999999" fill="#13161c" /><rect x="0.5" y="0.5" width="559" height="680.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.14" /><path d="M12 0H0V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M548 0H560V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M12 681.5999999999999H0V669.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M548 681.5999999999999H560V669.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><text x="40.0" y="60.0" class="mono" font-size="13" letter-spacing="1.95" fill="#ff655a">OWN PRODUCT · CLOSED TESTING</text><text x="38.0" y="132.0" class="disp" font-size="60" letter-spacing="-1.68" fill="#f6f7f8">LUMI</text><text x="40.0" y="180.0" class="sans" font-size="20" fill="#f6f7f8">A self-care app with an AI companion that runs a</text><text x="40.0" y="209.0" class="sans" font-size="20" fill="#f6f7f8">consultation by conversation and builds the routine</text><text x="40.0" y="238.0" class="sans" font-size="20" fill="#f6f7f8">from what it learns.</text><rect x="40" y="283" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="289.0" class="sans" font-size="17" fill="#aeb1b8">The model chain lives in an Edge Function: the device</text><text x="68.0" y="315.0" class="sans" font-size="17" fill="#aeb1b8">knows no model name, and keys never leave the server.</text><rect x="40" y="347" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="353.0" class="sans" font-size="17" fill="#aeb1b8">A fallback rule set by measurement — a 429 rotates the</text><text x="68.0" y="379.0" class="sans" font-size="17" fill="#aeb1b8">key, any other failure rotates the model.</text><rect x="40" y="411" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="417.0" class="sans" font-size="17" fill="#aeb1b8">Structured JSON output as the injection defense: a reply</text><text x="68.0" y="443.0" class="sans" font-size="17" fill="#aeb1b8">that can only fill a closed schema cannot carry an</text><text x="68.0" y="469.0" class="sans" font-size="17" fill="#aeb1b8">instruction.</text><rect x="40.5" y="521.5" width="88" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="51.0" y="539.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">FLUTTER</text><rect x="136.89999999999998" y="521.5" width="98" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="147.4" y="539.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">SUPABASE</text><rect x="243.04999999999995" y="521.5" width="59" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="253.6" y="539.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">DENO</text><rect x="310.19999999999993" y="521.5" width="118" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="320.7" y="539.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">POSTGRESQL</text><rect x="40.5" y="556.8" width="147" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="51.0" y="574.3" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">CLOUDFLARE R2</text><text x="40.0" y="639.6" class="mono" font-size="13" letter-spacing="1.95" fill="#f6f7f8">SEE LUMI</text><path d="M124.0 638.8199999999999L132.58 630.2399999999999M126.574 630.2399999999999H132.58V636.2459999999999" fill="none" stroke="#ff655a" stroke-width="1.6" class=""/><line x1="40" y1="648.5999999999999" x2="133.0" y2="648.5999999999999" stroke="#f6f7f8" stroke-opacity="0.35" stroke-width="1" class=""/></svg>