<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="917.8" viewBox="0 0 1120 917.8" role="img" aria-labelledby="t d"><title id="t">Projects — BIRDY, OWN PRODUCT · GOOGLE PLAY &amp; APP STORE</title><desc id="d">Aviary management SaaS for exotic bird breeders. I built it, shipped it and run it — growing organically, with no paid acquisition. Hybrid backend: Firebase issues the JWT, Supabase validates it, and Row Level Security isolates every user’s data. A genetics engine shared by mobile and desktop: crossing simulator, pedigree and inbreeding coefficient. Local-first desktop client on its own sync engine: outbox queue, poison-pill tolerance, ancestry ordering for foreign keys.</desc><style>@font-face{font-family:'disp';src:url(data:font/woff2;base64,) format('woff2')}.disp{font-family:'disp'}@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'mono'}@font-face{font-family:'sans';src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:'sans'}text{font-kerning:normal;text-rendering:geometricPrecision}</style><defs></defs><rect x="0" y="0" width="1120" height="917.8" fill="#080a0f" /><text x="40.0" y="50.0" class="mono" font-size="13" letter-spacing="1.95" fill="#ff655a">004</text><text x="1080.0" y="50.0" class="mono" font-size="13" letter-spacing="1.95" fill="#7d8088" text-anchor="end">OWN PRODUCTS + FREELANCE · 01 — 05</text><text x="37.0" y="142.0" class="disp" font-size="84" letter-spacing="-2.35" fill="#f6f7f8">PROJECTS</text><line x1="40" y1="177" x2="1080" y2="177" stroke="#f6f7f8" stroke-opacity="0.14" stroke-width="1" class=""/><rect x="0" y="178" width="1120" height="739.8" fill="#13161c" /><defs><radialGradient id="g" cx="1000" cy="917.8" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e02728" stop-opacity=".16"/><stop offset="1" stop-color="#e02728" stop-opacity="0"/></radialGradient></defs><rect x="0" y="178" width="1120" height="739.8" fill="url(#g)" /><rect x="0.5" y=