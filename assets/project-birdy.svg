p client on its own sync engine: outbox queue,</text><text x="68.0" y="507.0" class="sans" font-size="18" fill="#aeb1b8">poison-pill tolerance, ancestry ordering for foreign keys.</text><rect x="40.5" y="565.5" width="95" height="29" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="51.9" y="584.4" class="mono" font-size="14" letter-spacing="2.10" fill="#aeb1b8">FLUTTER</text><rect x="143.7" y="565.5" width="106" height="29" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="155.1" y="584.4" class="mono" font-size="14" letter-spacing="2.10" fill="#aeb1b8">RIVERPOD</text><rect x="257.4" y="565.5" width="74" height="29" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="268.8" y="584.4" class="mono" font-size="14" letter-spacing="2.10" fill="#aeb1b8">DRIFT</text><rect x="339.59999999999997" y="565.5" width="106" height="29" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="351.0" y="584.4" class="mono" font-size="14" letter-spacing="2.10" fill="#aeb1b8">FIREBASE</text><rect x="453.29999999999995" y="565.5" width="106" height="29" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="464.7" y="584.4" class="mono" font-size="14" letter-spacing="2.10" fill="#aeb1b8">SUPABASE</text><rect x="40.5" y="602.9" width="127" height="29" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="51.9" y="621.8" class="mono" font-size="14" letter-spacing="2.10" fill="#aeb1b8">POSTGRESQL</text><rect x="175.20000000000002" y="602.9" width="148" height="29" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="186.6" y="621.8" class="mono" font-size="14" letter-spacing="2.10" fill="#aeb1b8">PLAY BILLING</text><text x="40.0" y="687.8" class="mono" font-size="14" letter-spacing="2.10" fill="#f6f7f8">SEE BIRDY</text><path d="M140.5 686.9599999999999L149.74 677.7199999999999M143.272 677.7199999999999H149.74V684.1879999999999" fill="none" stroke="#ff655a" stroke-width="1.6" class=""/><line x1="40" y1="696.8" x2="150.5" y2="6