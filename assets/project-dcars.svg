<svg xmlns="http://www.w3.org/2000/svg" width="560" height="681.5999999999999" viewBox="0 0 560 681.5999999999999" role="img" aria-labelledby="t d"><title id="t">D’CARS BOX — FREELANCE · WORKSHOP ERP</title><desc id="d">A bespoke desktop ERP for a mechanic’s workshop: quote, work order, FIFO stock and payment in one loop. Answers what off-the-shelf tools don’t: which supplier sold the bad part. Runs fully offline on SQLite. The network is optional — updates, inspection photos, backups. Windows builds on every tag through GitHub Actions, with in-app auto-update.</desc><style>@font-face{font-family:'disp';src:url(data:font/woff2;base64,) format('woff2')}.disp{font-family:'disp'}@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'mono'}@font-face{font-family:'sans';src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:'sans'}text{font-kerning:normal;text-rendering:geometricPrecision}</style><defs></defs><rect x="0" y="0" width="560" height="681.5999999999999" fill="#13161c" /><rect x="0.5" y="0.5" width="559" height="680.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.14" /><path d="M12 0H0V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M548 0H560V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M12 681.5999999999999H0V669.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M548 681.5999999999999H560V669.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><text x="40.0" y="60.0" class="mono" font-size="13" letter-spacing="1.95" fill="#ff655a">FREELANCE · WORKSHOP ERP</text><text x="38.0" y="132.0" class="disp" font-size="60" letter-spacing="-1.68" fill="#f6f7f8">D’CARS BOX</text><text x="40.0" y="180.0" class="sans" font-size="20" fill="#f6f7f8">A bespoke desktop ERP for a mechanic’s</text><text x="40.0" y="209.0" class="sans" font-size="20" fill="#f6f7f8">workshop: quote, work order, FIFO stock and</text><text x="40.0" y="238.0" class="sans" font-size="20" fill="#f6f7f8">payment in one loop.</text><rect x="40" y="283" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="289.0" class="sans" font-size="17" fill="#aeb1b8">Answers what off-the-shelf tools don’t: which supplier</text><text x="68.0" y="315.0" class="sans" font-size="17" fill="#aeb1b8">sold the bad part.</text><rect x="40" y="347" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="353.0" class="sans" font-size="17" fill="#aeb1b8">Runs fully offline on SQLite. The network is optional —</text><text x="68.0" y="379.0" class="sans" font-size="17" fill="#aeb1b8">updates, inspection photos, backups.</text><rect x="40" y="411" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="417.0" class="sans" font-size="17" fill="#aeb1b8">Windows builds on every tag through GitHub Actions,</text><text x="68.0" y="443.0" class="sans" font-size="17" fill="#aeb1b8">with in-app auto-update.</text><rect x="40.5" y="495.5" width="166" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="51.0" y="513.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">FLUTTER DESKTOP</text><rect x="214.9" y="495.5" width="98" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="225.5" y="513.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">RIVERPOD</text><rect x="321.05" y="495.5" width="69" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="331.6" y="513.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">DRIFT</text><rect x="397.95" y="495.5" width="79" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="408.5" y="513.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">SQLITE</text><rect x="40.5" y="530.8" width="157" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="51.0" y="548.3" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">GITHUB ACTIONS</text><text x="40.0" y="639.6" class="mono" font-size="13" letter-spacing="1.95" fill="#f6f7f8">READ MORE</text><path d="M133.75 638.8199999999999L142.33 630.2399999999999M136.324 630.2399999999999H142.33V636.2459999999999" fill="none" stroke="#ff655a" stroke-width="1.6" class=""/><line x1="40" y1="648.5999999999999" x2="142.75" y2="648.5999999999999" stroke="#f6f7f8" stroke-opacity="0.35" stroke-width="1" class=""/></svg>