<svg xmlns="http://www.w3.org/2000/svg" width="560" height="681.5999999999999" viewBox="0 0 560 681.5999999999999" role="img" aria-labelledby="t d"><title id="t">INDUXAI — FREELANCE · INDUSTRIAL ML API</title><desc id="d">Turned a cement-kiln prediction script into a multi-tenant production API, consumed by the client’s own SaaS. Numerical parity verified against the original pipeline: same input, same number. Docker image cut from 1.72 GB to 734 MB by removing CUDA the production model never touched. Scope stated in writing: deployment contracted, model training out of scope.</desc><style>@font-face{font-family:'disp';src:url(data:font/woff2;base64,) format('woff2')}.disp{font-family:'disp'}@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'mono'}@font-face{font-family:'sans';src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:'sans'}text{font-kerning:normal;text-rendering:geometricPrecision}</style><defs></defs><rect x="0" y="0" width="560" height="681.5999999999999" fill="#13161c" /><rect x="0.5" y="0.5" width="559" height="680.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.14" /><path d="M12 0H0V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M548 0H560V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M12 681.5999999999999H0V669.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M548 681.5999999999999H560V669.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><text x="40.0" y="60.0" class="mono" font-size="13" letter-spacing="1.95" fill="#ff655a">FREELANCE · INDUSTRIAL ML API</text><text x="38.0" y="132.0" class="disp" font-size="60" letter-spacing="-1.68" fill="#f6f7f8">INDUXAI</text><text x="40.0" y="180.0" class="sans" font-size="20" fill="#f6f7f8">Turned a cement-kiln prediction script into a</text><text x="40.0" y="209.0" class="sans" font-size="20" fill="#f6f7f8">multi-tenant production API, consumed by the</text><text x="40.0" y="238.0" class="sans" font-size="20" fill="#f6f7f8">client’s own SaaS.</text><rect x="40" y="283" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="289.0" class="sans" font-size="17" fill="#aeb1b8">Numerical parity verified against the original pipeline:</text><text x="68.0" y="315.0" class="sans" font-size="17" fill="#aeb1b8">same input, same number.</text><rect x="40" y="347" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="353.0" class="sans" font-size="17" fill="#aeb1b8">Docker image cut from 1.72 GB to 734 MB by removing</text><text x="68.0" y="379.0" class="sans" font-size="17" fill="#aeb1b8">CUDA the production model never touched.</text><rect x="40" y="411" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="417.0" class="sans" font-size="17" fill="#aeb1b8">Scope stated in writing: deployment contracted, model</text><text x="68.0" y="443.0" class="sans" font-size="17" fill="#aeb1b8">training out of scope.</text><rect x="40.5" y="495.5" width="79" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="51.0" y="513.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">PYTHON</text><rect x="127.14999999999999" y="495.5" width="88" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="137.7" y="513.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">FASTAPI</text><rect x="223.54999999999998" y="495.5" width="88" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="234.1" y="513.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">XGBOOST</text><rect x="319.95" y="495.5" width="79" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="330.5" y="513.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">DOCKER</text><rect x="406.59999999999997" y="495.5" width="79" height="27" fill="none" stroke="#f6f7f8" strok