<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="498" viewBox="0 0 1120 498" role="img" aria-labelledby="t d"><title id="t">What I do</title><desc id="d">Automate manual work: Processes that depend on someone remembering become code that runs on its own — certificates, contracts, enrollment. Ship whole features: Screen, API, database and deploy. The whole thing, not just my slice of it. Connect systems: Payments, digital signatures and learning platforms talking to each other — without counting the same event twice. Watch what runs: Monitoring that flags business errors, not only server errors — before they turn into support tickets. Keep it secure: Certificates that can’t be forged, and credentials kept out of the code. Use AI with care: AI suggests, plain code executes, and a person approves. Never the other way around.</desc><style>@font-face{font-family:'body';src:url(data:font/woff2;base64,) format('woff2')}.body{font-family:'body'}@font-face{font-family:'head';src:url(data:font/woff2;base64,) format('woff2')}.head{font-family:'head'}@font-face{font-family:'label';src:url(data:font/woff2;base64,) format('woff2')}.label{font-family:'label'}text{font-kerning:normal;text-rendering:geometricPrecision}</style><defs></defs><rect x="0.0" y="0.0" width="364.0" height="254.0" rx="22" fill="#1c1b29" class=""/><rect x="28.0" y="28.0" width="44.0" height="44.0" rx="12" fill="#6e5cf6" class=""/><text x="50.0" y="55.0" class="label" font-size="13" fill="#ffffff" letter-spacing="1.56" text-anchor="middle">01</text><text x="28.0" y="114.0" class="head" font-size="24" fill="#f5f3ff" letter-spacing="-0.48">Automate manual work</text><text x="28.0" y="148.0" class="body" font-size="16" fill="#aba8c6">Processes that depend on someone</text><text x="28.0" y="172.0" class="body" font-size="16" fill="#aba8c6">remembering become code that runs on</text><text x="28.0" y="196.0" class="body" font-size="16" fill="#aba8c6">its own — certificates, contracts,</text><text x="28.0" y="220.0" class="body" font-size="16" fill="#aba8c6">enrollment.</text><rect x="378.0" y="0.0" width="364.0" height="254.0" rx="22" fill="#1c1b29" class=""/><rect x="406.0" y="28.0" width="44.0" height="44.0" rx="12" fill="#ffb547" class=""/><text x="428.0" y="55.0" class="label" font-size="13" fill="#16131f" letter-spacing="1.56" text-anchor="middle">02</text><text x="406.0" y="114.0" class="head" font-size="24" fill="#f5f3ff" letter-spacing="-0.48">Ship whole features</text><text x="406.0" y="148.0" class="body" font-size="16" fill="#aba8c6">Screen, API, database and deploy. The</text><text x="406.0" y="172.0" class="body" font-size="16" fill="#aba8c6">whole thing, not just my slice of it.</text><rect x="756.0" y="0.0" width="364.0" height="254.0" rx="22" fill="#1c1b29" class=""/><rect x="784.0" y="28.0" width="44.0" height="44.0" rx="12" fill="#3fd9a0" class=""/><text x="806.0" y="55.0" class="label" font-size="13" fill="#16131f" letter-spacing="1.56" text-anchor="middle">03</text><text x="784.0" y="114.0" class="head" font-size="24" fill="#f5f3ff" letter-spacing="-0.48">Connect systems</text><text x="784.0" y="148.0" class="body" font-size="16" fill="#aba8c6">Payments, digital signatures and</text><text x="784.0" y="172.0" class="body" font-size="16" fill="#aba8c6">learning platforms talking to each other</text><text x="784.0" y="196.0" class="body" font-size="16" fill="#aba8c6">— without counting the same event</text><text x="784.0" y="220.0" class="body" font-size="16" fill="#aba8c6">twice.</text><rect x="0.0" y="268.0" width="364.0" height="230.0" rx="22" fill="#1c1b29" class=""/><rect x="28.0" y="296.0" width="44.0" height="44.0" rx="12" fill="#5aaeff" class=""/><text x="50.0" y="323.0" class="label" font-size="13" fill="#16131f" letter-spacing="1.56" text-anchor="middle">04</text><text x="28.0" y="382.0" class="head" font-size="24" fill="#f5f3ff" letter-spacing="-0.48">Watch what runs</text><text x="28.0" y="416.0" class="body" font-size="16" fill="#aba8c6">Monitoring that flags business errors,</text><text x="28.0" y="440.0" class="body" font-size="16" fill="#aba8c6">not only server errors — before they</text><text x="28.0" y="464.0" class="body" font-size="16" fill="#aba8c6">turn into support tickets.</text><rect x="378.0" y="268.0" width="364.0" height="230.0" rx="22" fill="#1c1b29" class=""/><rect x="406.0" y="296.0" width="44.0" height="44.0" rx="12" fill="#ff8fb8" class=""/><text x="428.0" y="323.0" class="label" font-size="13" fill="#16131f" letter-spacing="1.56" text-anchor="middle">05</text><text x="406.0" y="382.0" class="head" font-size="24" fill="#f5f3ff" letter-spacing="-0.48">Keep it secure</text><text x="406.0" y="416.0" class="body" font-size="16" fill="#aba8c6">Certificates that can’t be forged, and</text><text x="406.0" y="440.0" class="body" font-size="16" fill="#aba8c6">credentials kept out of the code.</text><rect x="756.0" y="268.0" width="364.0" height="230.0" rx="22" fill="#1c1b29" class=""/><rect x="784.0" y="296.0" width="44.0" height="44.0" rx="12" fill="#6e5cf6" class=""/><text x="806.0" y="323.0" class="label" font-size="13" fill="#ffffff" letter-spacing="1.56" text-anchor="middle">06</text><text x="784.0" y="382.0" class="head" font-size="24" fill="#f5f3ff" letter-spacing="-0.48">Use AI with care</text><text x="784.0" y="416.0" class="body" font-size="16" fill="#aba8c6">AI suggests, plain code executes, and a</text><text x="784.0" y="440.0" class="body" font-size="16" fill="#aba8c6">person approves. Never the other way</text><text x="784.0" y="464.0" class="body" font-size="16" fill="#aba8c6">around.</text></svg>