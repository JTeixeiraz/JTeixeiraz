ent until the product</text><text x="805.3" y="156.0" class="body" font-size="16" fill="#16131f" fill-opacity="0.88">manager clicks approve.</text><rect x="805.3333333333334" y="228" width="286.7" height="6" rx="3" fill="#16131f" fill-opacity=".22"/><rect x="805.3333333333334" y="228" width="286.7" height="6" rx="3" fill="#16131f" class="bar b2"/><rect x="0.0" y="276.0" width="1120.0" height="184.0" rx="22" fill="#1c1b29" class=""/><rect x="32.0" y="306.0" width="243.8" height="25.3" rx="12.649999999999999" fill="#3fd9a0" class=""/><text x="43.7" y="323.1" class="label" font-size="11" fill="#16131f" letter-spacing="1.32">IN PRODUCTION AT XP EDUCAÇÃO</text><text x="32.0" y="376.0" class="headm" font-size="22" fill="#f5f3ff" letter-spacing="-0.22">SustentaBot — a Slack assistant that turns support requests into ready-to-work tasks.</text><text x="32.0" y="416.0" class="body" font-size="16" fill="#aba8c6">When it can’t read something, like an image, it says so instead of guessing.</text></svg>