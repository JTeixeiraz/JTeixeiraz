<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="t d"><title id="t">How I use AI</title><desc id="d">AI suggests: Reads the request, sorts it by urgency and suggests who should handle it. Code executes: Plain, predictable code does the routing. No AI in that path. A person approves: Nothing is sent until the product manager clicks approve. SustentaBot — a Slack assistant that turns support requests into ready-to-work tasks. When it can’t read something, like an image, it says so instead of guessing.</desc><style>@font-face{font-family:'body';src:url(data:font/woff2;base64,) format('woff2')}.body{font-family:'body'}@font-face{font-family:'head';src:url(data:font/woff2;base64,) format('woff2')}.head{font-family:'head'}@font-face{font-family:'headm';src:url(data:font/woff2;base64,) format('woff2')}.headm{font-family:'headm'}@font-face{font-family:'label';src:url(data:font/woff2;base64,) format('woff2')}.label{font-family:'label'}text{font-kerning:normal;text-rendering:geometricPrecision}@keyframes b0{0%,0%{transform:scaleX(0)}22%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}.b0{animation:b0 6s cubic-bezier(.65,0,.35,1) infinite}@keyframes b1{0%,22%{transform:scaleX(0)}44%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}.b1{animation:b1 6s cubic-bezier(.65,0,.35,1) infinite}@keyframes b2{0%,44%{transform:scaleX(0)}66%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}.b2{animation:b2 6s cubic-bezier(.65,0,.35,1) infinite}.bar{transform-box:fill-box;transform-origin:left center}@media (prefers-reduced-motion:reduce){.bar{animation:none}}</style><defs></defs><rect x="0.0" y="0.0" width="342.7" height="262.0" rx="22" fill="#6e5cf6" class=""/><text x="28.0" y="44.0" class="label" font-size="11" fill="#ffffff" letter-spacing="1.32" fill-opacity="0.75">STEP 1</text><text x="28.0" y="96.0" class="head" font-size="28" fill="#ffffff" letter-spacing="-0.56">AI suggests</text><text x="28.0" y="132.0" class=