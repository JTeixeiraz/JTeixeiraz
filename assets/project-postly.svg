<svg xmlns="http://www.w3.org/2000/svg" width="560" height="681.5999999999999" viewBox="0 0 560 681.5999999999999" role="img" aria-labelledby="t d"><title id="t">POSTLY — OPEN SOURCE · MIT</title><desc id="d">A desktop app that runs a marketing department on your machine: AI roles take turns on local models to research, decide, produce, audit and publish. A middleware, not an LLM wrapper. Never two models resident: measure free memory, load the strongest that fits, answer, unload. Model tier follows the role — whoever decides must reason; whoever executes a finished brief need not. Shared context as a weighted graph, no database. Releases for Linux, macOS and Windows.</desc><style>@font-face{font-family:'disp';src:url(data:font/woff2;base64,) format('woff2')}.disp{font-family:'disp'}@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'mono'}@font-face{font-family:'sans';src:url(data:font/woff2;base64,) format('woff2')}.sans{font-family:'sans'}text{font-kerning:normal;text-rendering:geometricPrecision}</style><defs></defs><rect x="0" y="0" width="560" height="681.5999999999999" fill="#13161c" /><rect x="0.5" y="0.5" width="559" height="680.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.14" /><path d="M12 0H0V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M548 0H560V12" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M12 681.5999999999999H0V669.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><path d="M548 681.5999999999999H560V669.5999999999999" fill="none" stroke="#f6f7f8" stroke-opacity="0.5" stroke-width="1.5"/><text x="40.0" y="60.0" class="mono" font-size="13" letter-spacing="1.95" fill="#ff655a">OPEN SOURCE · MIT</text><text x="38.0" y="132.0" class="disp" font-size="60" letter-spacing="-1.68" fill="#f6f7f8">POSTLY</text><text x="40.0" y="180.0" class="sans" font-size="20" fill="#f6f7f8">A desktop app that runs a marketing department</text><text x="40.0" y="209.0" class="sans" font-size="20" fill="#f6f7f8">on your machine: AI roles take turns on local</text><text x="40.0" y="238.0" class="sans" font-size="20" fill="#f6f7f8">models to research, decide, produce, audit and</text><text x="40.0" y="267.0" class="sans" font-size="20" fill="#f6f7f8">publish.</text><rect x="40" y="312" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="318.0" class="sans" font-size="17" fill="#aeb1b8">A middleware, not an LLM wrapper. Never two models</text><text x="68.0" y="344.0" class="sans" font-size="17" fill="#aeb1b8">resident: measure free memory, load the strongest that</text><text x="68.0" y="370.0" class="sans" font-size="17" fill="#aeb1b8">fits, answer, unload.</text><rect x="40" y="402" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="408.0" class="sans" font-size="17" fill="#aeb1b8">Model tier follows the role — whoever decides must</text><text x="68.0" y="434.0" class="sans" font-size="17" fill="#aeb1b8">reason; whoever executes a finished brief need not.</text><rect x="40" y="466" width="14" height="1.6" fill="#ff655a" /><text x="68.0" y="472.0" class="sans" font-size="17" fill="#aeb1b8">Shared context as a weighted graph, no database.</text><text x="68.0" y="498.0" class="sans" font-size="17" fill="#aeb1b8">Releases for Linux, macOS and Windows.</text><rect x="40.5" y="550.5" width="59" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="51.0" y="568.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">RUST</text><rect x="107.64999999999999" y="550.5" width="98" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="118.2" y="568.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">TAURI V2</text><rect x="213.79999999999998" y="550.5" width="69" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="224.3" y="568.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">REACT</text><rect x="290.7" y="550.5" width="118" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="301.2" y="568.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">TYPESCRIPT</text><rect x="416.34999999999997" y="550.5" width="79" height="27" fill="none" stroke="#f6f7f8" stroke-opacity="0.22" /><text x="426.9" y="568.0" class="mono" font-size="13" letter-spacing="1.95" fill="#aeb1b8">OLLAMA</text><text x="40.0" y="639.6" class="mono" font-size="13" letter-spacing="1.95" fill="#f6f7f8">VIEW REPOSITORY</text><path d="M192.25 638.8199999999999L200.83 630.2399999999999M194.824 630.2399999999999H200.83V636.2459999999999" fill="none" stroke="#ff655a" stroke-width="1.6" class=""/><line x1="40" y1="648.5999999999999" x2="201.25" y2="648.5999999999999" stroke="#f6f7f8" stroke-opacity="0.35" stroke-width="1" class=""/></svg>